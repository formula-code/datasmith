# The model list is managed dynamically by infra/refresh_models.py, which
# discovers live `vllm serve` processes and reconciles them into LiteLLM's
# DB-backed registry via the admin API (no restart). `make model-tunnel` runs
# the reconciler as a background loop; `make model-refresh` runs it once.
# Pin a model here only if it must survive regardless of what's running.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  drop_params: true
  request_timeout: 600
