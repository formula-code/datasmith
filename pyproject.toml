[project]
name = "fc-data"
version = "0.2.3"
description = "Python toolchain for building and maintaining FormulaCode benchmark tasks."
authors = [{ name = "Atharva Sehgal", email = "atharva.sehgal@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dspy>=2.6.27",
    "gitpython",
    "harbor @ git+https://github.com/formula-code/harbor.git",
    "httpx>=0.27",
    "huggingface-hub>=0.20",
    "jinja2>=3.1.6",
    "json5>=0.9",
    "portkey-ai>=1.14.3",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.1.1",
    "python-on-whales>=0.60",
    "supabase>=2.0",
    "tiktoken",
]

[project.scripts]
fc-data = "datasmith.update.cli:main"

[project.urls]
Homepage = "https://formula-code.github.io/datasmith/"
Repository = "https://github.com/formula-code/datasmith"
Documentation = "https://formula-code.github.io/datasmith/"

[dependency-groups]
dev = [
    "build>=1.0",
    "deptry>=0.23.0",
    "ipykernel",
    "ipython",
    "matplotlib",
    "mypy>=0.991",
    "pandas",
    "pandas-stubs",
    "pre-commit>=2.20.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0.0",
    "pytest>=7.2.0",
    "respx>=0.21",
    "ruff>=0.11.5",
    "tox-uv>=1.11.3",
    "types-tqdm",
]

docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/datasmith"]

[tool.mypy]
files = ["src"]
exclude = ["src/datasmith/agents/templates/", "src/datasmith/docker/templates/", "src/datasmith/harbor_adapter/template/"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "harbor.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: tests that build or run real containers"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
extend-exclude = ["archive/", "dataset/", "scratch/", "src/datasmith/docker/templates/", "src/datasmith/agents/templates/", "src/datasmith/harbor_adapter/template/"]
force-exclude = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # try-except return (common in fallback patterns)
    "TRY300",
    # subprocess call security (we control inputs)
    "S603",
    # partial executable path (we use git, codex, etc.)
    "S607",
    # jinja2 autoescape (we render markdown, not HTML)
    "S701",
    # mutable class attr without ClassVar (acceptable for registries)
    "RUF012",
    # PEP 695 type params require 3.12+; we still test on 3.11
    "UP046",
    "UP047",
    # ternary suggestions (readability preference)
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["datasmith", "dataset"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "PGH003", "B017", "SIM117", "F841"]
"src/datasmith/agents/templates/*" = ["S108", "S307"]
"*.py" = ["TRY003"]
"scratch/notebooks/*.ipynb" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.deptry]
exclude = ["src/datasmith/docker/templates/", "src/datasmith/agents/templates/", "src/datasmith/harbor_adapter/template/"]
ignore = ["DEP003"]
[tool.deptry.per_rule_ignores]
DEP001 = ["tomllib", "tomli"]
DEP004 = ["pandas"]

[[tool.mypy.overrides]]
module = "dspy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "supabase.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "python_on_whales.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasmith.agents.*"
disable_error_code = ["no-any-unimported", "import-untyped"]

[[tool.mypy.overrides]]
module = "portkey_ai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "postgrest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "json5.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tomli.*"
ignore_missing_imports = true
