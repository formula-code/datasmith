site_name: fc-data
site_url: https://formula-code.github.io/datasmith/
site_description: Python toolchain for building the FormulaCode benchmark
repo_url: https://github.com/formula-code/datasmith
repo_name: formula-code/datasmith

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

exclude_docs: |
  archive/
  design/Datasmith - Overview.md
  design/archived/
  design/components/datasmith.*.md

validation:
  links:
    not_found: info

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Pipeline (fc-data): guide/pipeline.md
      - Configuration: guide/configuration.md
      - Remote Access: guide/remote-access.md
  - User Guide:
      - Docker Images: guide/docker-images.md
      - Synthesis: guide/synthesis.md
      - Publishing: guide/publishing.md
      - Verification: guide/verification.md
      - Python API Quickstart: getting-started/quickstart.md
      - Monitoring: guide/monitoring.md
